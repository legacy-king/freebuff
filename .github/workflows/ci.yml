name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (check + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo check --workspace
        # --keep-going: report errors from every crate instead of aborting at the first failure
        run: cargo check --workspace --keep-going

      - name: cargo test
        # Runs the workspace's unit tests (billing webhook/identifier/meter
        # math).
        run: cargo test --workspace

  dashboard:
    name: Dashboard (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: npm ci
        run: npm ci

      - name: npm run build
        run: npm run build