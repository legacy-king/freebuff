# Freebuff PostgreSQL WAL Configuration
# This enables WAL-based branching, PITR, and replication

# ── WAL Level ────────────────────────────────────────────────────────────
# Must be 'replica' or 'logical' for replication and PITR
wal_level = logical

# ── WAL Sender Configuration ─────────────────────────────────────────────
max_wal_senders = 10
wal_keep_size = '1GB'
max_replication_slots = 10

# ── WAL Archiving ────────────────────────────────────────────────────────
# Archive WAL segments to the WAL service for PITR
archive_mode = on
archive_command = 'curl -X POST http://localhost:5001/v1/timelines/%f/wal -d @%p'
archive_timeout = 300  # Force archive every 5 minutes

# ── WAL Receiver (for replicas/branches) ─────────────────────────────────
wal_receiver_timeout = 60s
wal_receiver_status_interval = 10s

# ── Replication Settings ────────────────────────────────────────────────
hot_standby = on
recovery_target_timeline = 'latest'

# ── Checkpoint Settings ─────────────────────────────────────────────────
checkpoint_timeout = '5min'
checkpoint_completion_target = 0.9
max_wal_size = '2GB'
min_wal_size = '1GB'

# ── Memory Settings ──────────────────────────────────────────────────────
shared_buffers = '256MB'
effective_cache_size = '1GB'
work_mem = '8MB'
maintenance_work_mem = '128MB'

# ── Connection Settings ──────────────────────────────────────────────────
max_connections = 200

# ── Logging ──────────────────────────────────────────────────────────────
log_destination = 'stderr'
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d.log'
log_min_duration_statement = 1000
log_statement = 'ddl'
log_replication_commands = on

# ── Performance ──────────────────────────────────────────────────────────
random_page_cost = 1.1
effective_io_concurrency = 200
wal_buffers = '16MB'
